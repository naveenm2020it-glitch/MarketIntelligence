name: NSE Five-Date Historical Pilot
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Exactly five NSE trading dates, comma-separated (YYYY-MM-DD)'
        required: true
        default: '2020-04-13,2022-01-05,2024-01-05,2025-01-02,2026-01-02'
permissions:
  contents: read
concurrency:
  group: nse-five-date-pilot
  cancel-in-progress: false
jobs:
  historical-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate five-date pilot input
        env:
          PILOT_DATES: ${{ inputs.dates }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          dates = [date.fromisoformat(x.strip()) for x in os.environ["PILOT_DATES"].split(",") if x.strip()]
          expected = ["2020-04-13", "2022-01-05", "2024-01-05", "2025-01-02", "2026-01-02"]
          if len(dates) != 5 or len(set(dates)) != 5:
              raise SystemExit("Pilot must contain exactly five unique dates.")
          if sorted(x.isoformat() for x in dates) != expected:
              raise SystemExit(f"Pilot dates must be exactly: {','.join(expected)}")
          if any(x.weekday() >= 5 for x in dates):
              raise SystemExit("Pilot dates must be weekdays.")
          print("Validated exact five-date pilot:", ", ".join(x.isoformat() for x in sorted(dates)))
          PY
      - name: Download four NSE reports and replay Agents 2–6 for exact dates only
        env:
          PILOT_DATES: ${{ inputs.dates }}
        run: python downloader/nse_historical_backfill.py --dates "$PILOT_DATES" --minimum-samples 30
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-five-date-pilot-${{ github.run_number }}
          path: |
            data/raw/
            data/extracted/
            data/normalized/
            data/analysis/
            data/backfill/backfill_summary.json
          if-no-files-found: warn
          retention-days: 30
