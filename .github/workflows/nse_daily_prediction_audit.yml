name: NSE Daily Prediction Audit

on:
  # Run only after the official daily downloader finishes successfully.
  workflow_run:
    workflows: ["NSE Daily Downloader"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nse-daily-prediction-audit
  cancel-in-progress: false

jobs:
  daily-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve latest verified NSE trading date
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile
          from datetime import date, datetime
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          today = date.today()
          raw = subprocess.check_output([
              "gh", "release", "list", "--repo", repo,
              "--limit", "100", "--json", "tagName,isDraft,isPrerelease"
          ], text=True)
          releases = json.loads(raw)
          candidates = []
          for release in releases:
              tag = release.get("tagName", "")
              match = re.fullmatch(r"nse-data-(\d{4}-\d{2}-\d{2})", tag)
              if not match or release.get("isDraft") or release.get("isPrerelease"):
                  continue
              try:
                  release_day = date.fromisoformat(match.group(1))
              except ValueError:
                  continue
              if release_day <= today:
                  candidates.append((release_day, tag))
          candidates.sort(reverse=True)

          expected = {"equity_udiff", "fo_udiff", "participant_oi", "security_delivery"}
          selected = None
          selected_tag = None
          with tempfile.TemporaryDirectory(prefix="nse-audit-") as temp:
              for release_day, tag in candidates:
                  archive_name = f"nse-market-data-{release_day.isoformat()}.zip"
                  target_dir = Path(temp) / release_day.isoformat()
                  target_dir.mkdir()
                  attempt = subprocess.run([
                      "gh", "release", "download", tag, "--repo", repo,
                      "--pattern", archive_name, "--dir", str(target_dir)
                  ], capture_output=True, text=True)
                  archive = target_dir / archive_name
                  if attempt.returncode or not archive.is_file():
                      continue
                  try:
                      with zipfile.ZipFile(archive) as z:
                          # Release tag/ZIP date is publication date, not necessarily
                          # the NSE report trading date. Discover by summary content.
                          summaries = []
                          for name in z.namelist():
                              if not name.lower().endswith(".json"):
                                  continue
                              try:
                                  candidate_summary = json.loads(z.read(name))
                              except (ValueError, UnicodeDecodeError):
                                  continue
                              if isinstance(candidate_summary, dict) and "report_trading_dates" in candidate_summary:
                                  summaries.append(candidate_summary)
                          if len(summaries) != 1:
                              continue
                          summary = summaries[0]
                      dates = summary.get("report_trading_dates", {})
                      observed = set(dates.values())
                      if (summary.get("trading_date_consistency") != "passed"
                              or summary.get("failures")
                              or summary.get("missing_reports")
                              or set(summary.get("reports", {})) != expected
                              or set(dates) != expected
                              or len(observed) != 1):
                          continue
                      raw_trading_date = next(iter(observed))
                      try:
                          trading_day = date.fromisoformat(raw_trading_date)
                      except ValueError:
                          # NSE summary emits dates such as 11-Nov-2026.
                          trading_day = datetime.strptime(
                              raw_trading_date, "%d-%b-%Y"
                          ).date()
                      if trading_day > today or trading_day.weekday() >= 5:
                          continue
                      selected = trading_day.isoformat()
                      selected_tag = tag
                      break
                  except (OSError, ValueError, KeyError, zipfile.BadZipFile, json.JSONDecodeError):
                      continue

          if selected is None:
              print("No archive with four consistent, verified NSE report dates found; audit skipped.", file=sys.stderr)
              print("trading_date=")
              print("verified_release_tag=")
          else:
              print(f"Resolved verified NSE trading date {selected} from release {selected_tag}", file=sys.stderr)
              print(f"trading_date={selected}")
              print(f"verified_release_tag={selected_tag}")
          PY

      - name: Process verified session and replay Agents 2–7
        if: steps.session.outputs.trading_date != ''
        env:
          TRADING_DATE: ${{ steps.session.outputs.trading_date }}
        run: |
          python downloader/nse_historical_backfill.py \
            --dates "$TRADING_DATE" \
            --minimum-samples 30

      - name: Update permanent daily prediction audit
        if: steps.session.outputs.trading_date != ''
        run: |
          python -m agents.daily_prediction_audit \
            --analysis-root data/analysis \
            --validation-report data/backfill/walk_forward_validation.json \
            --output data/audit/daily_prediction_audit.json \
            --csv-output data/audit/daily_prediction_audit.csv

      - name: Persist compact daily snapshots and audit ledger to main
        if: steps.session.outputs.trading_date != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/analysis data/backfill data/audit
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily NSE prediction audit"
            git pull --rebase origin main
            git push
          else
            echo "No daily audit changes to persist."
          fi

      - name: Write daily audit summary
        if: always()
        run: |
          {
            echo "## NSE Daily Prediction Audit"
            echo "- Trading date: ${{ steps.session.outputs.trading_date || 'No verified NSE session; skipped' }}"
            echo "- Source: latest validated NSE public archive only"
            if [ -f data/audit/daily_prediction_audit.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/audit/daily_prediction_audit.json").read_text())
          print(f"- Settled predictions: {data.get('settled_count')}")
          print(f"- Pending predictions: {data.get('pending_count')}")
          print(f"- Agent 6 accuracy: {data.get('agent6_metrics_all_settled', {}).get('accuracy')}")
          print(f"- Matched baseline samples: {data.get('matched_comparison', {}).get('samples')}")
          print(f"- Persistence baseline accuracy: {data.get('matched_comparison', {}).get('persistence_baseline', {}).get('accuracy')}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily audit evidence
        if: always() && steps.session.outputs.trading_date != ''
        uses: actions/upload-artifact@v4
        with:
          name: nse-daily-prediction-audit-${{ github.run_number }}
          path: |
            data/analysis/
            data/backfill/
            data/audit/
          if-no-files-found: warn
          retention-days: 30
