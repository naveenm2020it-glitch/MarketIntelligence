name: NSE Daily Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 17:00 Asia/Kolkata, Monday-Friday (UTC is 11:30)
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-daily-downloader
  cancel-in-progress: false

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download official NSE reports and validate files
        run: python downloader/nse_downloader.py

      - name: Persist checksum-based report history
        if: always() && hashFiles('data/history/manifest.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update NSE report history manifest"
            if ! git push; then
              echo "History push raced with another repository update; merging latest remote history and retrying."
              cp data/history/manifest.json /tmp/nse-history-local.json
              git fetch origin main
              git reset --hard origin/main
              python - /tmp/nse-history-local.json data/history/manifest.json <<'PY'
          import json, sys
          from pathlib import Path
          local_path, remote_path = map(Path, sys.argv[1:])
          local = json.loads(local_path.read_text())
          remote = json.loads(remote_path.read_text()) if remote_path.exists() else {"schema_version": 1, "records": []}
          rows = {(r["report"], r["trading_date"], r["sha256"]): r for r in remote.get("records", [])}
          for row in local.get("records", []):
              key = (row["report"], row["trading_date"], row["sha256"])
              if key in rows:
                  current = rows[key]
                  current["seen_count"] = int(current.get("seen_count", 1)) + 1
                  current["last_seen_utc"] = max(current.get("last_seen_utc", ""), row.get("last_seen_utc", ""))
              else:
                  remote.setdefault("records", []).append(row)
          remote["updated_at_utc"] = max(remote.get("updated_at_utc", ""), local.get("updated_at_utc", ""))
          remote_path.parent.mkdir(parents=True, exist_ok=True)
          remote_path.write_text(json.dumps(remote, indent=2, ensure_ascii=False) + "\\n")
          PY
              git add data/history/manifest.json
              git commit -m "chore: merge NSE report history after concurrent update"
              git push
            fi
          else
            echo "History manifest unchanged; no commit needed."
          fi

      - name: Create permanent daily NSE archive
        if: always() && hashFiles('logs/nse_summary_*.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          SUMMARY="logs/nse_summary_${DATE}.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "Expected NSE summary not found: $SUMMARY"
            exit 1
          fi
          if ! python - "$SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          if data.get('failures') or data.get('missing_reports') or data.get('trading_date_consistency') != 'passed':
              print('Permanent archive withheld: report set incomplete or dates inconsistent.')
              print(json.dumps({'failures': data.get('failures'), 'missing_reports': data.get('missing_reports'), 'trading_date_consistency': data.get('trading_date_consistency')}, indent=2))
              raise SystemExit(1)
          print('All required NSE reports present and trading dates consistent.')
          PY
          then
            echo "Skipping permanent archive because validation did not pass."
            exit 0
          fi
          python - "$DATE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          date = sys.argv[1]
          archive = Path(f"nse-market-data-{date}.zip")
          roots = [Path("data/raw") / date, Path("data/extracted") / date, Path("data/history"), Path("logs")]
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for root in roots:
                  if root.exists():
                      for file in root.rglob("*"):
                          if file.is_file() and (root.name != "logs" or date in file.name):
                              z.write(file, file.as_posix())
          print(f"Created {archive} ({archive.stat().st_size} bytes)")
          PY
          TAG="nse-data-$DATE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing daily release $TAG"
          else
            gh release create "$TAG" --title "NSE Market Data $DATE" --notes "Verified daily NSE raw reports, extracted CSVs, validation summary, logs and checksum history. Retained as a GitHub Release asset."
          fi
          gh release upload "$TAG" "nse-market-data-$DATE.zip" --clobber

      - name: Upload reports, extracted CSVs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-market-data-${{ github.run_number }}
          path: |
            data/
            logs/
          if-no-files-found: warn
          retention-days: 30
