name: NSE Daily Downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 17:00 Asia/Kolkata, Monday-Friday (UTC is 11:30)
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-daily-downloader
  cancel-in-progress: false

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download official NSE reports and validate files
        run: python downloader/nse_downloader.py

      - name: Upload reports, extracted CSVs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-market-data-${{ github.run_number }}
          path: |
            data/
            logs/
          if-no-files-found: warn
          retention-days: 30
