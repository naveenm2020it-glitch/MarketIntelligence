name: NSE Historical EOD Backfill and Agent Replay
on:
  # Manual by default; the tagged merge below launches the user-requested two-year run once.
  push:
    branches: [main]
    paths:
      - .github/workflows/nse_historical_backfill.yml
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date inclusive (YYYY-MM-DD)'
        required: false
        default: '2024-11-12'
      end_date:
        description: 'End date inclusive (YYYY-MM-DD)'
        required: false
        default: '2026-11-12'
permissions:
  contents: write
concurrency:
  group: nse-historical-backfill
  cancel-in-progress: false
jobs:
  historical-backfill:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-two-year-backfill]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      START_DATE: ${{ inputs.start_date || '2024-11-12' }}
      END_DATE: ${{ inputs.end_date || '2026-11-12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download historical NSE reports and replay Agents 2–6 chronologically
        run: |
          python downloader/nse_historical_backfill.py --start-date "$START_DATE" --end-date "$END_DATE" --minimum-samples 30 \
            --validation-output data/backfill/historical_walk_forward_validation.json
      - name: Require a valid two-year walk-forward result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/backfill/historical_walk_forward_validation.json")
          if not path.is_file():
              raise SystemExit("Historical validation report was not created")
          report = json.loads(path.read_text(encoding="utf-8"))
          samples = report.get("metrics", {}).get("samples", 0)
          if report.get("status") != "passed" or samples < 30:
              raise SystemExit(f"Historical validation insufficient: status={report.get('status')}, samples={samples}; need at least 30")
          print(f"Historical walk-forward validation passed with {samples} valid pairs")
          PY
      - name: Persist historical Agent 6 and compact NIFTY futures snapshots
        if: always() && hashFiles('data/analysis/*/eod_market_confluence_intelligence.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/analysis data/backfill
          git add -A -- data/analysis data/backfill
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill historical NSE EOD agent snapshots"
            git pull --rebase origin main
            git push
          else
            echo "No historical snapshots to persist."
          fi
      - name: Upload raw NSE archive, normalized reports and validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-historical-backfill-${{ github.run_number }}
          path: |
            data/raw/
            data/extracted/
            data/normalized/
            data/analysis/
            data/backfill/
          if-no-files-found: warn
          retention-days: 90