name: ML Training Dataset Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/build_ml_training_dataset.py'
      - 'tests/test_ml_dataset_builder.py'
      - '.github/workflows/ml_training_dataset.yml'
      - 'data/analysis/**'
permissions:
  contents: read
concurrency:
  group: ml-training-dataset
  cancel-in-progress: false
jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build dataset from existing analysis snapshots only
        run: |
          python agents/build_ml_training_dataset.py \
            --analysis-root data/analysis \
            --output data/ml_dataset \
            --minimum-samples 30
      - name: Upload compact ML dataset
        uses: actions/upload-artifact@v4
        with:
          name: nse-ml-training-dataset-${{ github.run_number }}
          path: data/ml_dataset/
          if-no-files-found: error
          retention-days: 14
