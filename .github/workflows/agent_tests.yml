name: NSE AI Agent Tests
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'downloader/**'
      - 'tests/**'
      - '.github/workflows/agent_tests.yml'
      - '.github/workflows/nse_historical_backfill.yml'
      - '.github/workflows/nse_five_date_pilot.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/agent_tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  normalize-latest-nse-day:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and validate NSE reports
        run: python downloader/nse_downloader.py
      - name: Resolve verified NSE trading date
        run: |
          RUN_DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          SUMMARY="logs/nse_summary_${RUN_DATE}.json"
          DATE="$(python - "$SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"equity_udiff", "fo_udiff", "participant_oi", "security_delivery"}
          dates = summary.get("report_trading_dates", {})
          if summary.get("failures") or summary.get("missing_reports") or summary.get("trading_date_consistency") != "passed":
              raise SystemExit("NSE report collection is incomplete or date-inconsistent; refusing to run agents.")
          if set(dates) != expected or len(set(dates.values())) != 1:
              raise SystemExit(f"Expected four reports for one common NSE trading date; got {dates}")
          print(next(iter(dates.values())))
          PY
          )"
          echo "NSE_TRADING_DATE=$DATE" >> "$GITHUB_ENV"
          echo "Verified source NSE trading date: $DATE (collection date: $RUN_DATE)"
      - name: Normalize reports using actual NSE CSVs
        run: |
          DATE="${{ env.NSE_TRADING_DATE }}"
          python agents/data_normalization.py --date "$DATE"
      - name: Run Agent 2 — FII/DII Participant OI Intelligence
        run: python agents/participant_oi_intelligence.py --input "data/normalized/$NSE_TRADING_DATE/normalized.json" --history-root data/analysis
      - name: Run Agent 3 — Equity Delivery Strength Intelligence
        run: python agents/equity_delivery_strength.py --input "data/normalized/$NSE_TRADING_DATE/normalized.json" --history-root data/analysis
      - name: Run Agent 4 — Futures Buildup Intelligence
        run: python agents/futures_buildup_intelligence.py --input "data/normalized/$NSE_TRADING_DATE/normalized.json"
      - name: Run Agent 5 — NIFTY Option OI Support Resistance and Max Pain
        run: python agents/nifty_option_oi_intelligence.py --input "data/normalized/$NSE_TRADING_DATE/normalized.json"
      - name: Run Agent 6 — EOD Market Direction and Confluence Intelligence
        run: python agents/eod_market_confluence_intelligence.py --date "$NSE_TRADING_DATE" --analysis-root data/analysis
      - name: Run Agent 7 — Chronological Walk-Forward Validation
        run: |
          DATE="$NSE_TRADING_DATE"
          python agents/walk_forward_validation.py --analysis-root data/analysis --output "data/analysis/$DATE/walk_forward_validation.json"
      - name: Persist Agent analysis snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if ! git diff --cached --quiet; then
            git commit -m "data: persist daily AI agent analysis snapshots"
            git stash push --include-untracked --keep-index -m "temporary NSE run outputs"
            git pull --rebase origin main
            git push
          else
            echo "No new agent snapshots to persist."
          fi
      - name: Upload normalized output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-normalized-agent-output
          path: |
            data/normalized/
            logs/
          if-no-files-found: warn
          retention-days: 30
