name: NSE AI Agent Tests
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/agent_tests.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/agent_tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  normalize-latest-nse-day:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and validate NSE reports
        run: python downloader/nse_downloader.py
      - name: Normalize reports using actual NSE CSVs
        run: |
          DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          python agents/data_normalization.py --date "$DATE"
      - name: Run Agent 2 — FII/DII Participant OI Intelligence
        run: python agents/participant_oi_intelligence.py --input "data/normalized/$(TZ=Asia/Kolkata date +%Y-%m-%d)/normalized.json" --history-root data/analysis
      - name: Run Agent 3 — Equity Delivery Strength Intelligence
        run: python agents/equity_delivery_strength.py --input "data/normalized/$(TZ=Asia/Kolkata date +%Y-%m-%d)/normalized.json" --history-root data/analysis
      - name: Run Agent 4 — Futures Buildup Intelligence
        run: python agents/futures_buildup_intelligence.py --input "data/normalized/$(TZ=Asia/Kolkata date +%Y-%m-%d)/normalized.json"
      - name: Run Agent 5 — NIFTY Option OI Support Resistance and Max Pain\n        run: python agents/nifty_option_oi_intelligence.py --input "data/normalized/$(TZ=Asia/Kolkata date +%Y-%m-%d)/normalized.json"\n      - name: Persist Agent analysis snapshots\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add data/analysis/\n          if ! git diff --cached --quiet; then\n            git commit -m "data: persist daily AI agent analysis snapshots"\n            git stash push --include-untracked --keep-index -m "temporary NSE run outputs"\n            git pull --rebase origin main\n            git push\n          else\n            echo "No new agent snapshots to persist."\n          fi\n      - name: Upload normalized output\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: nse-normalized-agent-output\n          path: |\n            data/normalized/\n            logs/\n          if-no-files-found: warn\n          retention-days: 30\n\n# OLD_STEP_MARKER
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if ! git diff --cached --quiet; then
            git commit -m "data: persist daily participant OI intelligence snapshot"
            git stash push --include-untracked --keep-index -m "temporary NSE run outputs"
          git pull --rebase origin main
          git push
          else
            echo "No new Agent 2 snapshot to persist."
          fi
      - name: Upload normalized output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-normalized-agent-output
          path: |
            data/normalized/
            logs/
          if-no-files-found: warn
          retention-days: 30
